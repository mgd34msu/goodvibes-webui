name: CI

# Per-push CI: the checks that catch a regression in behavior, on every push
# and every PR to main. Each suite runs once per run.
#
#   typecheck   tsc over src/, scripts/ and e2e/ (and the check that every
#               TypeScript file is in one of those projects), plus the
#               workflow structure check
#   lint        ESLint over the tree
#   test        one run of the unit suite (bun test --isolate)
#   build       vite build, then the SDK pin / lockfile / install agreement
#   e2e         Playwright, the phone project, 4 workers, hermetic mock daemon
#
# The desktop and lan-origin Playwright projects run in release-gates.yml: from
# here before a push that releases, nightly, and on demand. Generated files and
# version stamps (index.html cache-bust values, the SDK-derived modules under
# src/lib/generated and src/styles/generated, README badges, workflow pins, the
# CHANGELOG section) are rewritten by `bun run release:prepare` at the version
# bump, never checked per push. See docs/testing-and-validation.md.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  # One Bun version for every job below.
  BUN_VERSION: "1.3.14"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PRs only. A push to main always runs to
  # completion, so its per-job verdict (and its release) is never lost to an
  # auto-cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (src, scripts, e2e, and every file is in a project)
        run: bun run typecheck

      - name: Workflow structure
        run: bun run workflows:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: SDK pin, lockfile and install agreement, import sweep
        run: bun run release:gate

  e2e:
    # Blocking (docs/decisions/2026-07-07-e2e-ci-in-ci.md): a failing job fails
    # the run. Every test owns its browser context and in-page mock daemon, so
    # the suite runs fully parallel on 4 workers.
    name: E2E (Playwright, phone)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium + OS deps (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Playwright, phone project
        run: bun run e2e:phone

      - name: Upload traces/report/screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-phone
          path: |
            e2e/.artifacts/report
            e2e/.artifacts/test-output
          retention-days: 14
          if-no-files-found: ignore

  # Does this push release? True for a push to main whose package.json version
  # has no tag yet: exactly the pushes auto-release tags. The release gates and
  # auto-release run only then, so an ordinary push pays for neither.
  release-intent:
    name: Release intent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      releasing: ${{ steps.intent.outputs.releasing }}
      version: ${{ steps.intent.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Is this version untagged?
        id: intent
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q "refs/tags/v${VERSION}"; then
            echo "v${VERSION} is already tagged; this push does not release."
            echo "releasing=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${VERSION} has no tag; this push releases it once every job is green."
            echo "releasing=true" >> "$GITHUB_OUTPUT"
          fi

  # The Playwright projects the per-push e2e job does not run (desktop and
  # lan-origin), for this commit, only when it would release. Together with the
  # phone job above that is the full matrix, each project run once.
  release-gates:
    name: Release gates
    needs: [release-intent]
    if: needs.release-intent.outputs.releasing == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-gates.yml
    with:
      playwright-projects: "--project=desktop --project=lan-origin"

  auto-release:
    # Zero-touch release: a green push-CI run on main is the only thing that
    # gates a release. The git tag and the GitHub release page are cut here from
    # CHANGELOG.md; no separate workflow, no manual dispatch, no human step
    # after every other job in this run, the release gates included, is green.
    # It runs only when release-intent says this push's version has no tag.
    #
    # This repo DOES ship an artifact now: the built bundle, as
    # goodvibes-webui-bundle-<version>.tar.gz plus a SHA256SUMS.txt. That is
    # what makes the browser surface part of the one-curl suite install — the
    # installer fetches it from this release, verifies it against that manifest
    # on the same terms as every binary in the suite, unpacks it beside the
    # binaries, and points the daemon at it. A release without the asset is a
    # release the installer will note and skip, so the packing step is fatal
    # rather than best-effort.
    name: Auto Release
    needs: [typecheck, lint, test, build, e2e, release-intent, release-gates]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.release-intent.outputs.releasing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Read version ${VERSION} from package.json"

      - name: Check whether the release tag already exists
        id: check-tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "Tag v${VERSION} already exists on origin — nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        if: steps.check-tag.outputs.exists != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "v${VERSION}" "${{ github.sha }}"
          git push origin "refs/tags/v${VERSION}"

      # The bundle is built HERE rather than restored from the test job's
      # workspace, so the bytes attached to the release come from the tagged
      # commit and nothing else. `pack:bundle` is deterministic, so re-running
      # this job produces the same archive and the same digest.
      - name: Set up Bun
        if: steps.check-tag.outputs.exists != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          cache: true

      - name: Install dependencies
        if: steps.check-tag.outputs.exists != 'true'
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.check-tag.outputs.exists != 'true'
        run: bun run build

      - name: Pack the bundle release asset
        if: steps.check-tag.outputs.exists != 'true'
        run: |
          set -eu
          bun run pack:bundle
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="release/goodvibes-webui-bundle-${VERSION}.tar.gz"
          if [ ! -f "$ASSET" ]; then
            echo "FATAL: expected $ASSET — the suite installer has nothing to fetch without it" >&2
            exit 1
          fi
          if ! grep -q "goodvibes-webui-bundle-${VERSION}.tar.gz" release/SHA256SUMS.txt; then
            echo "FATAL: release/SHA256SUMS.txt has no entry for the bundle — a missing manifest entry is a hard install failure" >&2
            exit 1
          fi
          ls -la release
          cat release/SHA256SUMS.txt

      - name: Extract changelog section
        if: steps.check-tag.outputs.exists != 'true'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES_FILE="release-notes.md"
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { found=1; next }
            found && /^## \[/ { found=0 }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.check-tag.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists — nothing to do."
            exit 0
          fi
          for attempt in $(seq 1 8); do
            # The bundle and its manifest are uploaded with the release, not
            # after it: a release page that exists without them is one the suite
            # installer reads as "this version ships no web UI".
            if gh release create "v${VERSION}" --title "v${VERSION}" --notes-file "${{ steps.changelog.outputs.notes_file }}" --verify-tag \
                 "release/goodvibes-webui-bundle-${VERSION}.tar.gz" \
                 "release/SHA256SUMS.txt"; then
              echo "Release v${VERSION} created."
              exit 0
            fi
            echo "gh release create attempt ${attempt} failed (try ${attempt}/8), retrying..."
            sleep 10
          done
          echo "gh release create failed after 8 attempts"
          exit 1
