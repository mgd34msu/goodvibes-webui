name: Release gates

# The Playwright projects a release needs and an ordinary push does not. They
# run:
#
#   - from ci.yml, before auto-release, on a push to main whose version has no
#     tag yet: the desktop and lan-origin projects (the per-push e2e job
#     already ran phone on the same commit, so nothing runs twice);
#   - nightly, and on demand (Actions > Release gates > Run workflow): every
#     project, phone + desktop + lan-origin, so drift shows up within a day.
#
# lan-origin serves the app from the runner's own private-network address to
# prove the plain-http LAN posture against Chromium's real secure-context
# rules; it skips itself on a host with no such interface.

on:
  workflow_call:
    inputs:
      playwright-projects:
        description: Playwright --project flags to run; empty runs every project.
        type: string
        required: false
        default: ""
  workflow_dispatch:
  schedule:
    # Nightly, 07:45 UTC.
    - cron: "45 7 * * *"

env:
  BUN_VERSION: "1.3.14"

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (Playwright, release set)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # Headless Chromium only, no apt step (see ci.yml's e2e job for why).
      - name: Install Playwright headless Chromium (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --only-shell chromium

      - name: Playwright
        env:
          PROJECTS: ${{ inputs.playwright-projects }}
        run: |
          set -eu
          # Empty (nightly, on demand) runs every project in playwright.config.ts.
          # shellcheck disable=SC2086
          bunx playwright test $PROJECTS

      - name: Upload traces/report/screenshots on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-release
          path: |
            e2e/.artifacts/report
            e2e/.artifacts/test-output
          retention-days: 14
          if-no-files-found: ignore
